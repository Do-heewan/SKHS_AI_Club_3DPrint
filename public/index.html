<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>성광 AI 3D 프린트 스튜디오</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- 로그인 화면 -->
  <section id="login-view" class="login-view" hidden>
    <form id="login-form" class="login-card">
      <div class="brand-mark">⬢</div>
      <h1>성광 AI 3D 프린트 스튜디오</h1>
      <p class="muted">말로 설명하면 AI가 3D 프린터용 도안을 만들어 줘요.</p>
      <label>이름<input name="name" autocomplete="name" maxlength="20" required placeholder="홍길동" /></label>
      <label>학번<input name="studentNo" inputmode="numeric" maxlength="6" required placeholder="예: 20315" /></label>
      <label>동아리<select name="club" required></select></label>
      <label id="access-code-field" hidden>입장 코드<input name="accessCode" autocomplete="off" placeholder="선생님이 알려 준 코드" /></label>
      <p id="login-error" class="error" hidden></p>
      <button type="submit" class="btn primary wide">입장하기</button>
    </form>
  </section>

  <!-- 메인 화면 -->
  <section id="app-view" class="app-view" hidden>
    <header class="topbar">
      <div class="brand"><span class="brand-mark small">⬢</span> 성광 AI 3D 스튜디오</div>
      <nav class="tabs">
        <button class="tab active" data-tab="studio">내 작업실</button>
        <button class="tab" data-tab="gallery">동아리 갤러리</button>
      </nav>
      <div class="me">
        <span id="me-label"></span>
        <span id="usage-label" class="pill"></span>
        <button id="logout-btn" class="btn ghost small">나가기</button>
      </div>
    </header>

    <!-- 작업실 -->
    <main id="studio" class="studio">
      <section class="chat-panel">
        <div class="panel-head">
          <select id="design-select" title="내 도안 목록"></select>
          <button id="new-design-btn" class="btn small">＋ 새 도안</button>
          <button id="delete-design-btn" class="btn ghost small" title="이 도안 삭제">삭제</button>
        </div>
        <div id="chat-log" class="chat-log"></div>
        <div id="examples" class="examples"></div>
        <form id="chat-form" class="chat-form">
          <div id="attach-list" class="attach-list" hidden></div>
          <div class="chat-row">
            <label class="btn attach-btn" title="참고 이미지 첨부 (최대 3장)">
              🖼️<input id="image-input" type="file" accept="image/*" multiple hidden />
            </label>
            <textarea id="chat-input" rows="3" placeholder="만들고 싶은 물건을 자세히 설명해 보세요. 참고할 사진은 🖼️ 버튼, 붙여넣기, 끌어다 놓기로 넣을 수 있어요."></textarea>
            <button id="send-btn" type="submit" class="btn primary">보내기</button>
          </div>
        </form>
      </section>

      <section class="view-panel">
        <div class="panel-head">
          <input id="title-input" class="title-input" maxlength="40" placeholder="도안 제목" />
          <label class="switch" title="동아리 친구들에게 보여 주기">
            <input id="share-toggle" type="checkbox" />
            <span>동아리에 공유</span>
          </label>
        </div>
        <div class="viewer-wrap">
          <div id="viewer" class="viewer"></div>
          <div id="viewer-overlay" class="viewer-overlay">
            <p>왼쪽에 만들고 싶은 물건을 설명하면<br />여기에 3D 모델이 나타나요.</p>
          </div>
          <div id="size-info" class="size-info" hidden></div>
        </div>
        <div class="toolbar">
          <span id="render-status" class="render-status"></span>
          <span class="spacer"></span>
          <button id="code-toggle-btn" class="btn small">코드 보기/수정</button>
          <button id="download-btn" class="btn primary small" disabled>STL 다운로드</button>
        </div>
        <div id="code-panel" class="code-panel" hidden>
          <textarea id="code-editor" spellcheck="false"></textarea>
          <div class="code-actions">
            <span class="muted small">맨 위 숫자(치수)를 바꾸고 '다시 만들기'를 눌러 보세요.</span>
            <button id="rerender-btn" class="btn small">다시 만들기</button>
          </div>
        </div>
      </section>
    </main>

    <!-- 갤러리 -->
    <main id="gallery" class="gallery" hidden>
      <div class="gallery-head">
        <h2 id="gallery-title">동아리 갤러리</h2>
        <p class="muted">'동아리에 공유'를 켠 작품이 여기에 보여요. 친구가 어떤 프롬프트로 만들었는지도 볼 수 있어요.</p>
      </div>
      <div id="gallery-grid" class="gallery-grid"></div>
    </main>
  </section>

  <!-- 갤러리 상세 -->
  <dialog id="detail-dialog" class="detail-dialog">
    <div class="detail">
      <div class="detail-view">
        <div id="detail-viewer" class="viewer"></div>
        <div id="detail-status" class="viewer-overlay"><p>불러오는 중…</p></div>
        <div id="detail-size" class="size-info" hidden></div>
      </div>
      <div class="detail-side">
        <div class="detail-top">
          <div>
            <h3 id="detail-title"></h3>
            <p id="detail-owner" class="muted"></p>
          </div>
          <button id="detail-close" class="btn ghost small">닫기 ✕</button>
        </div>
        <h4>사용한 프롬프트</h4>
        <ol id="detail-prompts" class="detail-prompts"></ol>
        <div class="detail-actions">
          <button id="detail-download" class="btn primary small" disabled>STL 다운로드</button>
        </div>
      </div>
    </div>
  </dialog>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
